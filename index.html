<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation de Mariage - Ahmed & Loubna</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500&family=Amiri&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #C5A059;
            --dark-gold: #9a7b3e;
            --envelope-green: #526352;
            --bg-overlay: rgba(245, 242, 238, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #f4efe9 url('images/bg-arch.jpg.jpeg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
        }

        .main-wrapper {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: var(--bg-overlay);
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 20px 15px;
        }

        /* Hero / Envelope Screen */
        .envelope-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85vh;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .header-title {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 25px;
            text-align: center;
        }

        .envelope-wrapper {
            position: relative;
            width: 280px;
            height: 190px;
            background-color: var(--envelope-green);
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            cursor: pointer;
            margin: 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .envelope-wrapper:hover {
            transform: scale(1.02);
        }

        /* Wax Seal Gold Stamp */
        .wax-seal {
            width: 65px;
            height: 65px;
            background: radial-gradient(circle, #e6ca85 0%, #c5a059 60%, #8a6a29 100%);
            border-radius: 50%;
            border: 2px solid #fff3d1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 0 6px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
        }

        .wax-seal span {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #4a3810;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.4);
            letter-spacing: 1px;
        }

        .click-instruction {
            text-align: center;
            margin-top: 20px;
        }

        .click-instruction .en {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #444;
            display: block;
            margin-bottom: 5px;
        }

        .click-instruction .ar {
            font-family: 'Amiri', serif;
            font-size: 1.1rem;
            color: #444;
            display: block;
        }

        /* Invitation Content (Hidden initially) */
        .invitation-container {
            width: 100%;
            display: none;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease, transform 1s ease;
            flex-direction: column;
            align-items: center;
        }

        .invitation-card {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }

        .invitation-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* RSVP Form Section */
        .rsvp-section {
            width: 100%;
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border: 1px solid #e8e0d5;
            margin-bottom: 30px;
            text-align: center;
        }

        .rsvp-title-en {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--gold);
            letter-spacing: 2px;
        }

        .rsvp-title-ar {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
            color: var(--gold);
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--gold);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--gold), var(--dark-gold));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 25px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(197, 160, 89, 0.4);
            margin-top: 10px;
        }

        .success-message {
            display: none;
            color: #2e7d32;
            font-size: 0.95rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <!-- ÉCRAN 1 : L'enveloppe -->
        <div class="envelope-screen" id="envelopeScreen">
            <p class="header-title">You have mail from</p>
            
            <div class="envelope-wrapper" onclick="openInvitation()">
                <div class="wax-seal">
                    <span>A & L</span>
                </div>
            </div>

            <div class="click-instruction">
                <span class="en">CLICK THE ENVELOPE TO OPEN</span>
                <span class="ar">انقر على الرسالة للفتح</span>
            </div>
        </div>

        <!-- ÉCRAN 2 : Invitation & Formulaire RSVP -->
        <div class="invitation-container" id="invitationContainer">
            
            <!-- Carte d'invitation -->
            <div class="invitation-card">
                <img src="images/invitation.jpg.jpeg" alt="Invitation Ahmed & Loubna">
            </div>

            <!-- Formulaire RSVP -->
            <div class="rsvp-section">
                <h2 class="rsvp-title-en">RSVP</h2>
                <h3 class="rsvp-title-ar">تأكيد الحضور</h3>
                
                <form id="rsvpForm">
                    <div class="form-group">
                        <label>Full Name / الاسم الكامل :</label>
                        <input type="text" id="fullName" name="fullName" required placeholder="Votre nom complet">
                    </div>

                    <div class="form-group">
                        <label>Will you attend? / هل ستنضم إلينا؟ :</label>
                        <select id="attendance" name="attendance" required>
                            <option value="Yes / نعم">Joyfully Accepts / بكل سرور سأحضر</option>
                            <option value="No / اعتذار">Regretfully Declines / أعتذر عن الحضور</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Number of Guests / عدد المرافقين :</label>
                        <input type="number" id="guests" name="guests" min="1" value="1" required>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">Confirm / تأكيد</button>
                </form>

                <div class="success-message" id="successMsg">
                    Merci ! Votre réponse a bien été enregistrée. <br> شكراً لك! تم تسجيل إجابتك بنجاح.
                </div>
            </div>

        </div>

    </div>

    <script>
        function openInvitation() {
            const envelopeScreen = document.getElementById('envelopeScreen');
            const invitationContainer = document.getElementById('invitationContainer');

            envelopeScreen.style.opacity = '0';
            envelopeScreen.style.transform = 'scale(0.9)';

            setTimeout(() => {
                envelopeScreen.style.display = 'none';
                invitationContainer.style.display = 'flex';
                setTimeout(() => {
                    invitationContainer.style.opacity = '1';
                    invitationContainer.style.transform = 'translateY(0)';
                }, 50);
            }, 800);
        }

        // Script d'envoi automatique vers Google Sheets
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx7oAz4usN4LbxSNxFgCAC0ONI7x6_66jfnPv4zI3ouoQyQ06iU2XQvxlPvv0uLehSt/exec';
        const form = document.getElementById('rsvpForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMsg = document.getElementById('successMsg');

        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = "Envoi en cours...";

            const data = {
                fullName: document.getElementById('fullName').value,
                attendance: document.getElementById('attendance').value,
                guests: document.getElementById('guests').value
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(() => {
                form.style.display = 'none';
                successMsg.style.display = 'block';
            })
            .catch(error => {
                console.error('Error!', error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm / تأكيد";
                alert("Une erreur s'est produite. Veuillez réessayer.");
            });
        });
    </script>
</body>
</html>
